<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center">
        <div class="w-full rounded-xl bg-gray-800 shadow-lg p-7 max-w-sm">
            <h1 class="text-3xl font-bold text-pink-500 text-center">LOGIN</h1>
            <p></p>

            <form class="mt-4">
                <div>
                    <label class="text-white font-semibold text-sm">Email</label>
                    <input 
                        type="email"
                        id="email"
                        class="bg-white w-full p-2 border-2 border-black rounded-md"
                        placeholder="selamat@email.com"
                    >
                </div>

                <div class="mt-1">
                    <label class="text-white font-semibold text-sm">Password</label>
                    <input 
                        type="password"
                        id="password"
                        class="bg-white w-full p-2 border-2 border-black rounded-md"
                        placeholder="Enter your password"
                    >
                </div>

                <button class="w-full mt-7 rounded-md justify-center py-2 px-4 border-2 border-pink-500 text-sm font-medium text-white bg-pink-500 hover:text-black shadow-[2px_2px_0px_rgba(0,0,0,1)]">
                    Login
                </button>
            </form>
        </div>
    </div>
</body>
</html>
