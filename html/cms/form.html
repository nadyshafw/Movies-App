
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie - NONTON</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="min-h-screen text-white">
        <main class="mx-auto max-w-2xl px-2 py-5">
            <div class="rounded-xl border border-pink-200 bg-pink-100 p-6 text-black shadow-xl">

                <div class="mb-4 text-center">
                    <h1 class="mt-2 text-2xl font-bold text-pink-500">Add Movie ✨</h1>
                </div>

                <form class="space-y-4">
                    <div>
                        <label class="mb-1 block font-medium">Movie Title</label>
                        <input type="text"
                            value=""
                            class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                    </div>

                    <div>
                        <label class="mb-1 block font-medium">Synopsis</label>
                        <textarea rows="4"
                            class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                        </textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="mb-1 block font-medium">Trailer URL</label>
                            <input type="text"
                                value=""
                                class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                        </div>

                        <div>
                            <label class="mb-1 block font-medium">Rating</label>
                            <input type="number"
                                value=""
                                class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                        </div>
                    </div>

                    <div>
                        <label class="mb-1 block font-medium">Genre</label>
                        <select
                            class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                            <option value="1">Action</option>
                        </select>
                    </div>

                    <div>
                        <label class="mb-1 block font-medium">Image URL</label>
                        <input type="text"
                            value=""
                            class="w-full rounded-lg border border-pink-200 bg-white p-3 outline-none focus:border-pink-500">
                    </div>

                    <div class="flex gap-3 pt-3">
                        <a href="index.html"
                            class="rounded-lg border border-pink-300 px-5 py-3 text-center font-semibold text-pink-500 transition hover:border-pink-700 w-1/3">
                            Cancel
                        </a>
                        <button type="submit"
                            class="flex-1 rounded-lg bg-pink-500 px-5 py-3 font-semibold text-white transition hover:bg-pink-600">
                            Add Movie
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
