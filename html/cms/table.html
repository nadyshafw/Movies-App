<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Table</title>
</head>
<body>
    <div class="overflow-x-auto p-4">
        <div class="mb-3 flex items-center justify-between">
            <h1 class="text-xl font-bold">Movies / Genres</h1>
            <button class="rounded bg-pink-500 px-4 py-1.5 text-sm text-white">+ Add Movie</button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead class="bg-black text-white border-b-4 border-black">
                    <tr>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">No</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Title</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Synopsis</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Trailer</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Image Url</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Rating</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Genre</th>
                    <th class="border border-gray-400 px-4 py-2 text-left font-bold">Actions</th>
                    </tr>
                </thead>
                <tbody> 
                        <tr>
                            <td class="border border-gray-400 px-4 py-2 font-medium"></td>
                            <td class="border border-gray-400 px-4 py-2 font-medium"></td>
                            <td class="border border-gray-400 px-4 py-2 font-medium"></td> 
                            <td class="border border-gray-400 px-4 py-2 font-medium"></td>
                            <td class="border border-gray-400 px-4 py-2 font-medium">
                        </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
