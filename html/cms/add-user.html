<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Add User</title>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center">
        <div class="w-full rounded-xl bg-gray-800 shadow-lg p-7 max-w-md">
            <h1 class="text-3xl font-bold text-pink-500 text-start">ADD USER</h1>
        
            <div class="mt-4 space-y-3"> 
                <form>
                    <div>
                        <label class="text-white font-semibold text-sm">Username</label>
                        <input 
                            type="text"
                            id="username"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder="Enter Your Username"
                        >
                    </div>

                    <div>
                        <label class="text-white font-semibold text-sm">Email</label>
                        <input 
                            type="email"
                            id="email"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder="Enter Your Email"
                        >
                    </div>

                    <div class="mt-1">
                        <label class="text-white font-semibold text-sm">Password</label>
                        <input 
                            type="password"
                            id="password"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder="Enter Your Password"
                        >
                    </div>

                    <div class="mt-1">
                        <label class="text-white font-semibold text-sm">Role</label>
                        <input 
                            type="role"
                            id="role"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder=""
                        >
                    </div>

                    <div>
                        <label class="text-white font-semibold text-sm">Phone Number</label>
                        <input 
                            type="text"
                            id="phone-number"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder="Enter Your Phone Number"
                        >
                    </div>

                    <div>
                        <label class="text-white font-semibold text-sm">Address</label>
                        <input 
                            type="text"
                            id="address"
                            class="bg-white w-full p-2 border-2 border-black rounded-md"
                            placeholder="Enter Your Address"
                        >
                    </div>

                    <button class="w-full mt-7 rounded-md justify-center py-2 px-4 border-2 border-pink-500 text-sm font-medium text-white bg-pink-500 hover:text-black shadow-[2px_2px_0px_rgba(0,0,0,1)]">
                        Add User
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
